[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workforce-intelligence"
version = "0.1.0"
description = "A transparent, rule-based workforce skills intelligence toolkit for emerging technology roles."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Christo Geo Jose"}]
dependencies = []

[project.scripts]
workforce-intel = "aw_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
